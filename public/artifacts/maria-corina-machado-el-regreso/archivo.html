<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>El Regreso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: a wire-desk log. Time rail on the left, one dispatch card per unique piece of content;
   the route and places views are map plates over the same data. */
:root {
  --paper: #f4f5f2; --card: #ffffff; --ink: #16181b; --muted: #5b6168; --rule: #dcdfd8;
  --accent: #0d4f8b; --accent-soft: #e3ecf5; --mark: #e8b416; --mark-soft: #fbf1cf;
  --alert: #a8261d; --alert-soft: #f8e4e1; --land: #e6e8e1; --land-ve: #d6dccf; --sea: #eef2f4;
  --display: "Archivo Narrow", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111316; --card: #1a1d21; --ink: #e9ebe6; --muted: #9aa1a8; --rule: #2c3036;
    --accent: #7db4ea; --accent-soft: #1b2a3a; --mark: #f0c548; --mark-soft: #3a3016;
    --alert: #f08a7e; --alert-soft: #3d1f1c; --land: #22262b; --land-ve: #2f3a32; --sea: #15191d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111316; --card: #1a1d21; --ink: #e9ebe6; --muted: #9aa1a8; --rule: #2c3036;
  --accent: #7db4ea; --accent-soft: #1b2a3a; --mark: #f0c548; --mark-soft: #3a3016;
  --alert: #f08a7e; --alert-soft: #3d1f1c; --land: #22262b; --land-ve: #2f3a32; --sea: #15191d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.wrap { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
header .wrap { padding-block: 14px 10px; display: grid; gap: 8px; }
.mast { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
h1 { margin: 0; font: 700 30px/1 var(--display); letter-spacing: -0.01em; text-transform: uppercase; }
.dateline { font: 600 13px/1.3 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.dateline b { color: var(--ink); font-weight: 700; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a { font: 600 14px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); text-decoration: none; padding: 8px 10px 7px; border-radius: 4px; }
nav a[aria-current="page"] { background: var(--ink); color: var(--paper); }
nav a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.controls { display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: center; }
.controls input[type=search] { flex: 1 1 240px; min-width: 0; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 4px; background: var(--card); color: var(--ink); font: inherit; font-size: 15px; }
.controls label { font-size: 14px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.filter-pill { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 999px; padding: 4px 10px; cursor: pointer; font-family: inherit; }
main .wrap { padding-block: 8px 80px; }
.status { color: var(--muted); font-size: 14px; padding: 18px 0; }

/* timeline */
.hour { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 0 14px; content-visibility: auto; contain-intrinsic-size: auto 1200px; }
.hour-label { grid-column: 1 / -1; margin: 26px 0 8px; display: flex; align-items: baseline; gap: 10px; border-top: 2px solid var(--ink); padding-top: 6px; }
.hour-label span { font: 700 22px/1 var(--display); font-variant-numeric: tabular-nums; }
.hour-label small { color: var(--muted); font-size: 13px; }
.rail { font: 600 15px/1.2 var(--display); font-variant-numeric: tabular-nums; color: var(--muted); padding-top: 14px; text-align: right; }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; margin: 6px 0; min-width: 0; }
.moment-run { grid-column: 2; border-left: 4px solid var(--mark); padding-left: 10px; margin: 6px 0; min-width: 0; }
.moment-run .mhead { font: 600 12px/1.2 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: var(--mark-soft); display: inline-block; padding: 3px 6px; border-radius: 3px; margin-top: 6px; }
.moment-run .row { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 0 10px; margin-left: -84px; }
.moment-run .row .rail { padding-left: 8px; }
.who { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 14px; }
.who a { color: var(--ink); font-weight: 600; text-decoration: none; }
.who a:hover { text-decoration: underline; }
.credit { font-size: 13px; color: var(--muted); }
.credit b { color: var(--accent); font-weight: 600; }
.credit abbr { cursor: help; text-decoration: underline dotted; }
.text { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.media { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-top: 10px; }
.media a { position: relative; display: block; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 4px; overflow: hidden; background: var(--land); }
.media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.media .badge { position: absolute; left: 6px; bottom: 6px; background: rgba(0, 0, 0, .7); color: #fff; font: 600 11px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; padding: 4px 6px; border-radius: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 12.5px; line-height: 1.2; padding: 3px 8px; border-radius: 3px; background: var(--paper); color: var(--muted); border: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
.chip.place { background: var(--accent-soft); color: var(--accent); border-color: transparent; cursor: pointer; font-family: inherit; }
.chip.flag { background: var(--alert-soft); color: var(--alert); border-color: transparent; font-weight: 600; }
details { margin-top: 8px; font-size: 14px; }
summary { cursor: pointer; color: var(--muted); }
.copies { list-style: none; margin: 6px 0 0; padding: 0; }
.copies li { display: flex; flex-wrap: wrap; gap: 2px 8px; padding: 5px 0; border-top: 1px solid var(--rule); }
.copies .role { font: 600 11px/1.6 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); min-width: 72px; }
.copies .why { color: var(--muted); }
.copies a { color: var(--accent); }

/* maps */
.plate { display: grid; gap: 16px; }
.plate h2 { font: 700 22px/1.1 var(--display); text-transform: uppercase; margin: 22px 0 0; text-wrap: balance; }
.plate p.lede { margin: 0; color: var(--muted); max-width: 65ch; }
.maps { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 10px; }
@media (max-width: 640px) { .maps { grid-template-columns: minmax(0, 1fr); } }
figure { margin: 0; background: var(--sea); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
figure svg { display: block; width: 100%; height: auto; }
figcaption { font-size: 12px; color: var(--muted); padding: 6px 10px; border-top: 1px solid var(--rule); background: var(--card); }
.land { fill: var(--land); stroke: var(--rule); stroke-width: 1; }
.land.ve { fill: var(--land-ve); stroke: var(--muted); stroke-width: .8; }
.route-line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-dasharray: 6 4; }
.stop circle { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
.stop text { fill: var(--card); font: 700 12px var(--display); text-anchor: middle; dominant-baseline: central; }
.dot { fill: var(--alert); fill-opacity: .55; stroke: var(--alert); stroke-width: 1; cursor: pointer; }
.dot-label { fill: var(--ink); font: 600 12px var(--display); paint-order: stroke; stroke: var(--sea); stroke-width: 3px; }
ol.stops, ul.places { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
ol.stops li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; }
ol.stops .n { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--card); font: 700 13px/28px var(--display); text-align: center; }
ol.stops .meta { font: 600 13px/1.3 var(--display); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
ol.stops .meta b { color: var(--ink); }
ol.stops p { margin: 4px 0 0; overflow-wrap: anywhere; }
ol.stops a { color: var(--accent); font-size: 14px; }
.places-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.places-cols h3 { font: 700 14px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; margin: 0 0 8px; color: var(--muted); }
ul.places li button { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; text-align: left; background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 12px; color: var(--ink); font: inherit; cursor: pointer; }
ul.places li button:hover { border-color: var(--accent); }
ul.places .pn { font-weight: 600; }
ul.places .pc { font: 700 18px/1 var(--display); font-variant-numeric: tabular-nums; color: var(--alert); grid-row: span 2; align-self: center; }
ul.places .pt { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); max-width: 70ch; }
@media (max-width: 520px) {
  .hour { grid-template-columns: 46px minmax(0, 1fr); gap: 0 8px; }
  .moment-run .row { grid-template-columns: 40px minmax(0, 1fr); margin-left: -62px; }
  h1 { font-size: 24px; }
}
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } .card:hover { border-color: var(--muted); } }
</style>

<header>
  <div class="wrap">
    <div class="mast"><h1>El Regreso</h1><div class="dateline" id="dateline">Cargando…</div></div>
    <nav aria-label="Vistas">
      <a href="#todo" data-view="todo">Línea de tiempo</a>
      <a href="#ruta" data-view="ruta">Su ruta</a>
      <a href="#lugares" data-view="lugares">Concentraciones</a>
    </nav>
    <div class="controls" id="controls">
      <input type="search" id="q" placeholder="Buscar texto, @cuenta o lugar" aria-label="Buscar">
      <label><input type="checkbox" id="featured" checked> Solo destacados</label>
      <label><input type="checkbox" id="onlyMedia"> Con foto o video</label>
      <button class="filter-pill" id="placeFilter" hidden></button>
    </div>
  </div>
</header>
<main><div class="wrap" id="view"><p class="status">Cargando la línea de tiempo…</p></div></main>

<script>
const ROLE = { reupload: "re-subida", retweet: "repost", quote: "cita", reply: "respuesta" };
const RULE = { retweet: "repost", media_key: "mismo archivo en X", source_status: "X indica el origen", sha256: "archivo idéntico",
  phash: "misma imagen", phash_weak: "imagen parecida", video_frames: "mismo video", audio: "mismo audio",
  text_jaccard: "texto copiado", curator_merge: "unido a mano" };

const CLAIM = { curator: "Crédito confirmado", source_status: "Origen según X", text_credit: "Acreditado a",
  watermark_ocr: "Marca de agua de", earliest_on_x: "Primero en X", best_quality: "Mejor copia de",
  footage_from: "Usa imágenes de" };
const FLAG = { recycled_pre_event: "Imagen anterior al 25-oct", predates_event: "Publicado antes del 25-oct", unhydrated: "Sin contenido aún" };
let D = null, placeFilter = null;
const thumbCache = {};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => (n || 0).toLocaleString("es-VE");
const hm = t => t.slice(11, 16);
const $ = id => document.getElementById(id);

function credit(e) {
  if (!e.credits.length) return "";
  const [t, ...rest] = e.credits;
  const extra = rest.filter(c => c.handle.toLowerCase() !== t.handle.toLowerCase()).slice(0, 1)
    .map(c => ` · ${esc(CLAIM[c.claim] || c.claim)} <b>@${esc(c.handle)}</b>`).join("");
  return `<div class="credit">${esc(CLAIM[t.claim] || t.claim)} <b>@${esc(t.handle)}</b>
    <abbr title="${esc(t.evidence)}">¿por qué?</abbr>${extra}</div>`;
}

function card(e) {
  const c = e.counts;
  const media = e.media.length ? `<div class="media">${e.media.map(m => `
      <a href="${esc(e.post.url)}" target="_blank" rel="noopener" aria-label="Ver en X">
        ${m.thumb ? `<img alt="" data-key="${esc(m.key)}" data-hour="${esc(e.hour)}">` : ""}
        ${m.type !== "photo" ? `<span class="badge">${m.type === "video" ? "▶ video" : "gif"}</span>` : ""}</a>`).join("")}</div>` : "";
  const chips = [
    ...e.flags.map(f => `<span class="chip flag">${esc(FLAG[f] || f)}</span>`),
    ...e.places.map(p => `<button class="chip place" data-place="${esc(p.id || p.name)}" title="${esc(p.evidence)}">${esc(p.name)}</button>`),
    c.reuploads ? `<span class="chip">${fmt(c.reuploads)} re-subidas</span>` : "",
    c.reposts ? `<span class="chip">${fmt(c.reposts)} reposts</span>` : "",
    c.views ? `<span class="chip">${fmt(c.views)} vistas</span>` : "",
  ].join("");
  const copies = e.copies.filter(x => x.role !== "retweet");
  const det = copies.length ? `<details><summary>${copies.length + e.more_copies} copias y reacciones</summary><ul class="copies">
      ${copies.map(x => `<li><span class="role">${ROLE[x.role] || x.role}</span><span>${hm(x.t)}</span>
        <a href="${esc(x.url)}" target="_blank" rel="noopener">@${esc(x.handle || "?")}</a>
        ${x.why.length ? `<span class="why">${x.why.map(r => RULE[r] || r).join(", ")}</span>` : ""}</li>`).join("")}
      ${e.more_copies ? `<li><span class="why">y ${e.more_copies} más</span></li>` : ""}</ul></details>` : "";
  return `<article class="card" id="${esc(e.id)}">
    <div class="who"><a href="${esc(e.post.url)}" target="_blank" rel="noopener">@${esc(e.post.handle || "?")}</a>${credit(e)}</div>
    <p class="text">${esc(e.post.text || "")}</p>${media}<div class="chips">${chips}</div>${det}</article>`;
}

function matches(e, q) {
  if ($("featured").checked && !e.featured && !q && !placeFilter) return false;
  if ($("onlyMedia").checked && !e.media.length) return false;
  if (placeFilter && !e.places.some(p => (p.id || p.name) === placeFilter)) return false;
  if (!q) return true;
  return [e.post.text, e.post.handle, ...e.places.map(p => p.name), ...e.credits.map(c => c.handle)]
    .join(" ").toLowerCase().includes(q.replace(/^@/, ""));
}

function renderTimeline() {
  const q = $("q").value.trim().toLowerCase();
  const list = D.entries.filter(e => matches(e, q));
  const byHour = new Map();
  for (const e of list) { if (!byHour.has(e.hour)) byHour.set(e.hour, []); byHour.get(e.hour).push(e); }
  let html = `<p class="status">${fmt(list.length)} de ${fmt(D.entries.length)} piezas${$("featured").checked && !q && !placeFilter ? " (destacadas: las de más alcance o re-subidas por varias cuentas)" : ""}</p>`;
  for (const [hour, items] of byHour) {
    html += `<section class="hour" data-hour="${esc(hour)}"><div class="hour-label"><span>${esc(hour.slice(11))}:00</span><small>${esc(hour.slice(0, 10))} · ${items.length} piezas</small></div>`;
    for (let i = 0; i < items.length; i++) {
      const e = items[i];
      if (e.moment && items[i + 1]?.moment === e.moment) {
        const run = [];
        while (i < items.length && items[i].moment === e.moment) run.push(items[i++]);
        i--;
        html += `<div class="rail"></div><div class="moment-run"><span class="mhead">Mismo lugar y momento · ${run.length} piezas</span>
          ${run.map(r => `<div class="row"><div class="rail">${esc(hm(r.t))}</div>${card(r)}</div>`).join("")}</div>`;
      } else {
        html += `<div class="rail">${esc(hm(e.t))}</div>${card(e)}`;
      }
    }
    html += `</section>`;
  }
  if (!list.length) html += `<p class="status">Nada coincide con la búsqueda.</p>`;
  $("view").innerHTML = html;
  observeHours();
}

const io = "IntersectionObserver" in window ? new IntersectionObserver(entries => {
  for (const en of entries) if (en.isIntersecting) { io.unobserve(en.target); loadThumbs(en.target); }
}, { rootMargin: "800px 0px" }) : null;
function observeHours() { document.querySelectorAll("section.hour").forEach(s => io ? io.observe(s) : loadThumbs(s)); }
async function loadThumbs(section) {
  const hour = section.dataset.hour, files = D.thumb_files[hour];
  if (!files) return;
  try {
    thumbCache[hour] ??= Promise.all(files.map(f => fetch("https://pub-610a2c1e16bb4a81900d6ed8d51cfdae.r2.dev/maria-corina-machado-el-regreso/data/" + f).then(r => r.json()))).then(parts => Object.assign({}, ...parts));
    const map = await thumbCache[hour];
    section.querySelectorAll("img[data-key]").forEach(img => { if (map[img.dataset.key]) img.src = map[img.dataset.key]; });
  } catch (err) { console.warn("thumbs", hour, err); }
}

function svgMap(viewBox, inner, cls = "") {
  const m = D.map;
  const shapes = m.shapes.map(s => `<path class="land${s.id === "862" ? " ve" : ""}" d="${s.d}"></path>`).join("");
  return `<svg viewBox="${viewBox}" class="${cls}" role="img" aria-label="Mapa de Venezuela">${shapes}${inner}</svg>`;
}
const CCS = "461 119 43 29"; // lon -67.15…-66.55, lat 10.35…10.75: Caracas, Chacao, Petare, La Guaira

function renderRoute() {
  const r = D.route;
  const pts = r.filter(s => s.xy);
  const line = pts.length > 1 ? `<polyline class="route-line" points="${pts.map(s => s.xy.join(",")).join(" ")}"></polyline>` : "";
  const stops = sc => pts.map((s, i) => `<g class="stop" transform="translate(${s.xy[0]},${s.xy[1]})"><circle r="${11 * sc}"></circle><text style="font-size:${12 * sc}px">${r.indexOf(s) + 1}</text></g>`).join("");
  $("view").innerHTML = `<section class="plate">
    <h2>Su ruta</h2>
    <p class="lede">Lugares que nombran sus propias cuentas (@MariaCorinaYA y @VenteVenezuela), en orden. Cada parada enlaza a la publicación que la menciona.</p>
    ${pts.length ? `<div class="maps">
      <figure>${svgMap(`0 0 ${D.map.width} ${D.map.height}`, line + stops(1))}<figcaption>Venezuela · ${pts.length} paradas con lugar</figcaption></figure>
      <figure>${svgMap(CCS, line.replace('class="route-line"', 'class="route-line" style="stroke-width:.6;stroke-dasharray:2 1.5"') + stops(0.22))}<figcaption>Detalle: Caracas y La Guaira</figcaption></figure>
    </div>` : `<p class="status">Sus cuentas todavía no han nombrado un lugar reconocible.</p>`}
    <ol class="stops">${r.map((s, i) => `<li><span class="n">${i + 1}</span><div>
      <div class="meta"><b>${esc(s.place)}</b> · ${esc(hm(s.t))} · @${esc(s.handle)}</div>
      <p>${esc(s.text)}</p><a href="${esc(s.url)}" target="_blank" rel="noopener">Ver en X</a></div></li>`).join("")}</ol>
    <p class="note">Ubicaciones aproximadas: el centro de la ciudad, estado o lugar nombrado en el texto, no coordenadas del video. El orden es el de publicación: a veces sus cuentas publican un resumen de una parada cuando ya están en la siguiente.</p>
  </section>`;
}

function renderPlaces() {
  const ve = D.places.filter(p => !p.diaspora), dia = D.places.filter(p => p.diaspora);
  const max = Math.max(1, ...ve.map(p => p.n));
  const dots = sc => ve.filter(p => p.xy).map(p => `<circle class="dot" data-place="${esc(p.id)}" cx="${p.xy[0]}" cy="${p.xy[1]}" r="${(4 + 22 * Math.sqrt(p.n / max)) * sc}"><title>${esc(p.name)}: ${p.n} piezas</title></circle>`).join("");
  const labels = sc => ve.filter(p => p.xy).slice(0, 14).map(p => `<text class="dot-label" style="font-size:${12 * sc}px;stroke-width:${3 * sc}px" x="${p.xy[0] + 8 * sc}" y="${p.xy[1] - 6 * sc}">${esc(p.name)}</text>`).join("");
  const list = arr => arr.map(p => `<li><button data-place="${esc(p.id)}"><span class="pn">${esc(p.name)}</span><span class="pc">${fmt(p.n)}</span>
      <span class="pt">${esc(hm(p.first))}–${esc(hm(p.last))} · ${fmt(p.views)} vistas</span></button></li>`).join("");
  $("view").innerHTML = `<section class="plate">
    <h2>Concentraciones</h2>
    <p class="lede">Dónde dicen estar las publicaciones sobre ella: cada círculo es un lugar nombrado en el texto o en carteles de las fotos, del tamaño del número de piezas únicas. Toca un lugar para ver su línea de tiempo.</p>
    <div class="maps">
      <figure>${svgMap(`0 0 ${D.map.width} ${D.map.height}`, dots(1) + labels(1))}<figcaption>Venezuela · ${ve.length} lugares</figcaption></figure>
      <figure>${svgMap(CCS, dots(0.25) + labels(0.25))}<figcaption>Detalle: Caracas y La Guaira</figcaption></figure>
    </div>
    <div class="places-cols"><div><h3>Venezuela</h3><ul class="places">${list(ve)}</ul></div>
      <div><h3>Diáspora</h3>${dia.length ? `<ul class="places">${list(dia)}</ul>` : `<p class="note">Aún no hay publicaciones desde otras ciudades.</p>`}</div></div>
    <p class="note">Un lugar nombrado dice dónde afirma estar la publicación, no dónde se grabó. La verificación colaborativa vendrá después.</p>
  </section>`;
}

function setPlace(id) {
  placeFilter = id;
  const p = D.places.find(p => p.id === id);
  $("placeFilter").hidden = !id;
  $("placeFilter").textContent = id ? `Lugar: ${p ? p.name : id} ✕` : "";
  if (location.hash !== "#todo") location.hash = "todo"; else route();
}

function route() {
  const view = ["todo", "ruta", "lugares"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "todo";
  document.querySelectorAll("nav a").forEach(a => { if (a.dataset.view !== view) a.removeAttribute("aria-current"); else a.setAttribute("aria-current", "page"); });
  $("controls").hidden = view !== "todo";
  ({ todo: renderTimeline, ruta: renderRoute, lugares: renderPlaces })[view]();
  window.scrollTo(0, 0);
}

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-place]");
  if (el) { ev.preventDefault(); setPlace(el.dataset.place); }
});
$("placeFilter").addEventListener("click", () => setPlace(null));
let t;
for (const id of ["q", "featured", "onlyMedia"]) $(id).addEventListener("input", () => { clearTimeout(t); t = setTimeout(renderTimeline, 150); });
window.addEventListener("hashchange", route);

fetch("https://pub-610a2c1e16bb4a81900d6ed8d51cfdae.r2.dev/maria-corina-machado-el-regreso/data/index.json").then(r => r.json()).then(data => {
  D = data;
  const upd = new Date(D.generated_utc).toLocaleTimeString("es-VE", { hour: "2-digit", minute: "2-digit", timeZone: "America/Caracas" });
  $("dateline").innerHTML = `25 de octubre de 2026 · <b>${fmt(D.totals.posts)}</b> publicaciones → <b>${fmt(D.totals.artifacts)}</b> piezas únicas · actualizado ${esc(upd)} (Caracas)`;
  route();
}).catch(err => { $("view").innerHTML = `<p class="status">No se pudo cargar la línea de tiempo (${esc(err.message)}). Recarga la página.</p>`; });
</script>
