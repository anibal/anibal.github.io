name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Ship gates (handoff §9): 100/100/100/100, LCP<1.5s, CLS=0, TBT<50ms
      - run: npm run lhci
